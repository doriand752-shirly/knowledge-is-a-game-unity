# Build Flutter iOS IPA on GitHub-hosted macOS and upload to TestFlight.
# Uses App Store Connect API key (same Appy Geek ASC path). No Dimitri Mac.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID, ASC_APP_ID (optional)
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload IPA to App Store Connect / TestFlight'
        required: true
        type: boolean
        default: true
      kiag_api:
        description: 'KIAG Colyseus API base URL'
        required: true
        type: string
        default: 'http://85.17.145.134:2567'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build_upload:
    name: Flutter IPA → TestFlight
    runs-on: macos-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          pod install --repo-update

      - name: Install Fastlane
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          gem install bundler --no-document
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Write ASC API key (never echoed)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          set -euo pipefail
          test -n "${ASC_KEY_P8:-}" || { echo "MISSING_SECRET ASC_KEY_P8"; exit 1; }
          test -n "${ASC_KEY_ID:-}" || { echo "MISSING_SECRET ASC_KEY_ID"; exit 1; }
          test -n "${ASC_ISSUER_ID:-}" || { echo "MISSING_SECRET ASC_ISSUER_ID"; exit 1; }
          test -n "${APPLE_TEAM_ID:-}" || { echo "MISSING_SECRET APPLE_TEAM_ID"; exit 1; }
          mkdir -p ios/asc
          KEY_FILE="ios/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_FILE"
          {
            echo "ASC_KEY_ID=${ASC_KEY_ID}"
            echo "ASC_ISSUER_ID=${ASC_ISSUER_ID}"
            echo "ASC_KEY_PATH=${GITHUB_WORKSPACE}/mobile/${KEY_FILE}"
            echo "ASC_KEY_FILENAME=AuthKey_${ASC_KEY_ID}.p8"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
            if [ -n "${ASC_APP_ID:-}" ]; then echo "ASC_APP_ID=${ASC_APP_ID}"; fi
          } > ios/asc/.env.asc
          echo "ASC_KEY_WRITTEN keyIdLen=${#ASC_KEY_ID} issuerLen=${#ASC_ISSUER_ID} p8Bytes=$(wc -c < "$KEY_FILE" | tr -d ' ') teamLen=${#APPLE_TEAM_ID}"

      - name: Build IPA + upload (Fastlane CI)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          KIAG_API: ${{ inputs.kiag_api }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload }}
          CI: 'true'
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          bundle exec fastlane ci_testflight

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiag-player-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14
